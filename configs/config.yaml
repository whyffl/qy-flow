# 应用配置
app:
  name: "workflow-engine"
  version: "1.0.0"

# 工作流引擎配置
workflow_engine:
  # 最大并发工作流数量
  max_concurrent: 1000
  # 默认超时时间（秒）
  default_timeout: 30
  # 工作协程池大小
  worker_pool_size: 100
  # 是否启用缓存
  enable_cache: true
  # 缓存过期时间（秒）
  cache_ttl: 3600
  # 关闭超时时间
  shutdown_timeout: "30s"

# 规则引擎配置
rule_engine:
  # 默认超时时间（秒）
  default_timeout: 30
  # 工作协程池大小
  worker_pool_size: 50
  # 正则表达式池大小
  regex_pool_size: 100
